<template id="__bundler_thumbnail"><svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="400" fill="#CDC0A7"/><circle cx="200" cy="180" r="66" fill="#594C40"/><text x="200" y="330" font-family="Georgia, serif" font-size="26" letter-spacing="5" fill="#413F3E" text-anchor="middle">STUDIO</text></svg></template></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;veilOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hero veil&quot;}}">
class Component extends DCLogic {
  // The corner frame is this site's only navigation and it is position:fixed, so its
  // colour has to follow what is behind it. The footage is near-white plaster, so over
  // the hero the glyphs go near-black (the light/sand branch is invisible on it); below
  // the hero the override is dropped and CornerFrame's own camel default returns.
  // tone stays "ink" in the markup, so if this never runs the page is still the shipped
  // design rather than sand-on-sand.
  applyVeil() {
    const o = this.props && this.props.veilOpacity;
    document.documentElement.style.setProperty("--sb-veil", String(typeof o === "number" ? o : 0.3));
  }
  componentDidUpdate() { this.applyVeil(); }
  componentDidMount() {
    this.applyVeil();
    const v = document.getElementById("sbStudioHeroVid");
    if (v) { v.muted = true; v.defaultMuted = true; v.volume = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    // Measure what is actually behind the glyphs instead of guessing per section: this
    // page runs plaster video, greige, oxblood and camel behind the same fixed nav, so
    // any single hard-coded value collides with one of them.
    const lum = (c) => {
      const m = /(\d+),\s*(\d+),\s*(\d+)/.exec(c || "");
      if (!m) return null;
      const f = (v) => { v = +v / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      return 0.2126 * f(m[1]) + 0.7152 * f(m[2]) + 0.0722 * f(m[3]);
    };
    const lumAt = (x, y) => {
      const els = document.elementsFromPoint(x, y) || [];
      for (const el of els) {
        if (el.closest && el.closest("[data-sb-frame]")) continue;
        const cs = getComputedStyle(el);
        if (cs.position === "fixed") continue;
        // The hero footage is near-white plaster; treat any video/image as light.
        if (el.tagName === "VIDEO" || el.tagName === "IMG") return 0.82;
        const L = lum(cs.backgroundColor);
        if (L !== null && !/,\s*0\)$/.test(cs.backgroundColor)) return L;
      }
      return null;
    };
    // Per glyph, not per page: mid-scroll the S can sit on greige while STUDIO/WORK sit
    // on the oxblood panel, so each slot gets its own colour.
    this._prev = {};
    const pad = 44;
    this._onScroll = () => {
      const h = window.innerHeight, w = window.innerWidth;
      const at = { tl: [pad, pad + 24], tr: [w - pad, pad + 24], left: [pad - 10, h * 0.5], right: [w - pad + 10, h * 0.5] };
      const s = document.documentElement.style;
      let votes = 0, n = 0;
      for (const k in at) {
        const L = lumAt(at[k][0], at[k][1]);
        if (L === null) continue;
        const was = this._prev[k];
        const dark = was === undefined ? L < 0.18 : (was === "light" ? L < 0.26 : L < 0.12);
        n++; if (dark) votes++;
        const next = dark ? "light" : "ink";
        if (next === was) continue;
        this._prev[k] = next;
        s.setProperty("--sb-corner-ink-" + k, dark ? "var(--sb-paper)" : "#221f1b");
      }
      // The slot vars are the refinement; the base var is what every already-loaded
      // CornerFrame actually reads, so it must always carry a usable colour too.
      if (!n) return;
      const baseDark = votes * 2 > n;
      if (baseDark !== this._baseDark) {
        this._baseDark = baseDark;
        s.setProperty("--sb-corner-ink", baseDark ? "var(--sb-paper)" : "#221f1b");
      }
    };
    // 6s (CornerFrame's default) leaves a visible dead zone mid-ramp when scrolling
    // hero -> oxblood, which takes well under that.
    document.documentElement.style.setProperty("--sb-corner-ease", "2.4s");
    window.addEventListener("scroll", this._onScroll, { passive: true });
    window.addEventListener("resize", this._onScroll, { passive: true });
    this._onScroll();
    this._heroTimer = setTimeout(this._onScroll, 120);
  }
  componentWillUnmount() {
    window.removeEventListener("scroll", this._onScroll);
    window.removeEventListener("resize", this._onScroll);
    clearTimeout(this._heroTimer);
    const s = document.documentElement.style;
    ["", "-tl", "-tr", "-left", "-right"].forEach((k) => s.removeProperty("--sb-corner-ink" + k));
    s.removeProperty("--sb-corner-ease");
  }
  renderVals() {
    const go = {
      home: "index.html",
      studio: "studio.html",
      work: "work.html",
      project: "project.html",
      contact: "contact.html",
    };
    return {
      goHome: () => { window.location.href = go.home; },
      goStudio: () => { window.location.href = go.studio; },
      goWork: () => { window.location.href = go.work; },
      onNavigate: (route) => { if (go[route]) window.location.href = go[route]; },
    };
  }
}
</script>
